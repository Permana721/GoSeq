{{define "content"}}
<div class="auth-container">
  <div class="auth-card">
    <h1 class="auth-title">Admin Login</h1>
    <p class="auth-subtitle">Authenticate to write and edit journals</p>

    {{if .Error}}
      <div class="error-banner">{{.Error}}</div>
    {{end}}

    <form action="/duaempatdua" method="POST">
      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-input" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
    </form>
  </div>
</div>
{{end}}
